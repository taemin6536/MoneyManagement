name: Deploy (Fly.io)

# Deploys the backend API to Fly.io. The backend hosts the scheduler and the
# Telegram/Slack delivery, so shipping backend changes (e.g. the daily report
# fix) only needs this app. Frontend can be added as a second job later.
#
# Requires a repository secret named FLY_API_TOKEN:
#   Settings → Secrets and variables → Actions → New repository secret
#   Generate with:  fly tokens create deploy -a moneymangement-api

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/qqq-investment-strategy-tfRTR
    paths:
      - backend/**
      - .github/workflows/deploy.yml

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy backend (moneymangement-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config backend/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
