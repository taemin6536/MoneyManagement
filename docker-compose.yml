services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-moneymanagement}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm} -d ${POSTGRES_DB:-moneymanagement}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mm}:${POSTGRES_PASSWORD:-mm_local_dev}@postgres:5432/${POSTGRES_DB:-moneymanagement}
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: 8000
      APP_SECRET: ${APP_SECRET:-dev-secret}
      SINGLE_USER_PASSWORD: ${SINGLE_USER_PASSWORD:-change-me}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NUMBER: ${KIS_ACCOUNT_NUMBER:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_PAPER_MODE: ${KIS_PAPER_MODE:-true}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://backend:8000
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - ./frontend/components:/app/components
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
